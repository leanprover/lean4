name = "lake"
srcDir = "../../src/lake"
defaultTargets = ["Lake", "lake"]

[[lean_lib]]
name = "Lake"
defaultFacets = ["shared"]
# `Lake.Check` links the export parser, which lives beside `src/lake`
needs = ["LeanExport"]

[[lean_lib]]
name = "LeanExport"
srcDir = ".."
globs = ["LeanExport.*"]
defaultFacets = ["shared"]

[[lean_exe]]
name = "lake"
root = "LakeMain"
needs = ["Lake"]
supportInterpreter = true

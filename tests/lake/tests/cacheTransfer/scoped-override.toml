# A system configuration that overrides the dependency's `downloadCacheService`
# (`depFlat` in `service-dep.toml`) with a service that has package scopes.
# `test.sh` replaces `%URL%` with the URL of the running mock server.

[[cache.service]]
name = "depFlat"
kind = "s3"
artifactEndpoint = "%URL%/ok/a1"
revisionEndpoint = "%URL%/ok/r1"

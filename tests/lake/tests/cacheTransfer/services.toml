# A cache service for each fault mode of `server.py`.
# `test.sh` replaces `%URL%` with the URL of the running mock server.

[cache]
defaultUploadService = "ok"

[[cache.service]]
name = "ok"
kind = "s3"
artifactEndpoint = "%URL%/ok/a0"
revisionEndpoint = "%URL%/ok/r0"

[[cache.service]]
name = "deny"
kind = "s3"
artifactEndpoint = "%URL%/deny/a0"
revisionEndpoint = "%URL%/deny/r0"

[[cache.service]]
name = "denyArtifacts"
kind = "s3"
artifactEndpoint = "%URL%/deny/a0"
revisionEndpoint = "%URL%/ok/r0"

[[cache.service]]
name = "denyRevisions"
kind = "s3"
artifactEndpoint = "%URL%/ok/a0"
revisionEndpoint = "%URL%/deny/r0"

[[cache.service]]
name = "corrupt"
kind = "s3"
artifactEndpoint = "%URL%/corrupt/a0"
revisionEndpoint = "%URL%/ok/r0"

[[cache.service]]
name = "truncate"
kind = "s3"
artifactEndpoint = "%URL%/truncate/a0"
revisionEndpoint = "%URL%/ok/r0"

[[cache.service]]
name = "reset"
kind = "s3"
artifactEndpoint = "%URL%/reset/a0"
revisionEndpoint = "%URL%/ok/r0"

[[cache.service]]
name = "empty"
kind = "s3"
artifactEndpoint = "%URL%/empty/a0"
revisionEndpoint = "%URL%/ok/r0"

[[cache.service]]
name = "flaky"
kind = "s3"
artifactEndpoint = "%URL%/flaky/a0"
revisionEndpoint = "%URL%/ok/r0"

[[cache.service]]
name = "flakyCorrupt"
kind = "s3"
artifactEndpoint = "%URL%/flakycorrupt/a0"
revisionEndpoint = "%URL%/ok/r0"

[[cache.service]]
name = "badCount"
kind = "reservoir"
apiEndpoint = "%URL%/badcount/api/v1"

[[cache.service]]
name = "apiError"
kind = "reservoir"
apiEndpoint = "%URL%/apierror/api/v1"

# Uploads to the unscoped services `service-dep.toml` and `pkg-services.toml`
# declare for downloads

[[cache.service]]
name = "flatDep"
kind = "s3"
artifactEndpoint = "%URL%/ok/a1"
revisionEndpoint = "%URL%/ok/r1"
hasPackageScopes = false

[[cache.service]]
name = "flatRoot"
kind = "s3"
artifactEndpoint = "%URL%/ok/a2"
revisionEndpoint = "%URL%/ok/r2"
hasPackageScopes = false

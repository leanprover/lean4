<!DOCTYPE html>
<html><body><pre id="out"></pre>
<script type="module">
const out = document.getElementById("out");
const log = (...a) => { out.textContent += a.join(" ") + "\n"; console.log(...a); };

const TAG = ["div","button","span","ul","li"];
function readStr(exp, mem, id) {
  const ptr = exp.lean_ui_string_ptr(id)>>>0;
  const len = exp.lean_ui_string_len(id)>>>0;
  if (!ptr||!len) return "";
  return new TextDecoder().decode(new Uint8Array(mem.buffer, ptr, len));
}
function applyAll(exp, mem) {
  const n = exp.lean_ui_effect_count(0)>>>0;
  log("effects", n, "mem pages", mem.buffer.byteLength/65536);
  for (let i=0;i<n;i++) {
    const op=exp.lean_ui_effect_at(i,0)>>>0;
    const a=exp.lean_ui_effect_at(i,3)>>>0;
    const b=exp.lean_ui_effect_at(i,4)>>>0;
    if (op===1) log(" create", "class", readStr(exp,mem,b));
    if (op===2 && a===255) log(" label", readStr(exp,mem,b).slice(0,40));
    if (op===5) log(" setClass", readStr(exp,mem,a));
  }
}

async function main() {
  let memory=null;
  const imports = {
    wasi_snapshot_preview1: {
      environ_get:()=>0,
      environ_sizes_get:(c,b)=>{const v=new DataView(memory.buffer);v.setUint32(c,0,true);v.setUint32(b,0,true);return 0;},
      fd_close:()=>0, fd_fdstat_get:()=>8, fd_prestat_get:()=>8, fd_prestat_dir_name:()=>8,
      fd_read:()=>8, fd_seek:()=>8,
      fd_write:(fd,iovs,n,p)=>{new DataView(memory.buffer).setUint32(p,0,true);return 0;},
      proc_exit:(c)=>{throw new Error("exit "+c);},
      random_get:(b,l)=>{crypto.getRandomValues(new Uint8Array(memory.buffer).subarray(b,b+l));return 0;},
      clock_time_get:(_i,_p,r)=>{new DataView(memory.buffer).setBigUint64(r,0n,true);return 0;},
    }
  };
  const {instance} = await WebAssembly.instantiate(await (await fetch("./ui.wasm")).arrayBuffer(), imports);
  memory = instance.exports.memory;
  if (instance.exports._initialize) instance.exports._initialize();
  const e = instance.exports;
  log("mem0", memory.buffer.byteLength);
  let model = e.lean_ui_boot(0)>>>0;
  log("boot model", model>>>0, "mem", memory.buffer.byteLength);
  try { applyAll(e, memory); } catch(err) { log("apply ERR", err.message); }
  try {
    model = e.lean_ui_dispatch(model, 0)>>>0;
    log("intro ok", model>>>0, "mem", memory.buffer.byteLength);
    applyAll(e, memory);
  } catch(err) {
    log("dispatch ERR", err.name, err.message);
    log(err.stack);
  }
  try {
    model = e.lean_ui_dispatch(model, 0)>>>0;
    log("intro2 ok", model>>>0);
  } catch(err) {
    log("dispatch2 ERR", err.message, err.stack);
  }
}
main().catch(e => log("TOP", e, e.stack));
</script></body></html>

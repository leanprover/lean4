<!DOCTYPE html>
<html><body><pre id="out"></pre>
<script type="module">
const out=document.getElementById("out");
const log=(...a)=>{out.textContent+=a.join(" ")+"\n";};
async function main(){
  let memory=null;
  const imports={wasi_snapshot_preview1:{
    environ_get:()=>0,environ_sizes_get:(c,b)=>{const v=new DataView(memory.buffer);v.setUint32(c,0,true);v.setUint32(b,0,true);return 0;},
    fd_close:()=>0,fd_fdstat_get:()=>8,fd_prestat_get:()=>8,fd_prestat_dir_name:()=>8,fd_read:()=>8,fd_seek:()=>8,
    fd_write:(a,b,c,p)=>{new DataView(memory.buffer).setUint32(p,0,true);return 0;},
    proc_exit:(c)=>{throw new Error("exit "+c);},
    random_get:(b,l)=>{crypto.getRandomValues(new Uint8Array(memory.buffer).subarray(b,b+l));return 0;},
    clock_time_get:(_i,_p,r)=>{new DataView(memory.buffer).setBigUint64(r,0n,true);return 0;},
  }};
  const {instance}=await WebAssembly.instantiate(await(await fetch("http://127.0.0.1:8765/ui.wasm")).arrayBuffer(),imports);
  memory=instance.exports.memory;
  if(instance.exports._initialize) instance.exports._initialize();
  const e=instance.exports;
  const dispatch=(name)=>{
    const bytes=new TextEncoder().encode(name);
    const ptr=e.lean_ui_scratch_ptr()>>>0;
    new Uint8Array(memory.buffer,ptr,bytes.length).set(bytes);
    return e.lean_ui_dispatch_s(model>>>0,ptr,bytes.length)>>>0;
  };
  let model=e.lean_ui_boot(0)>>>0;
  log("boot goals",model&0xffff);
  for(const n of ["intro","intro","constructor","exact:0","exact:1"]){
    model=dispatch(n);
    log(n,"goals",model&0xffff,"solved",(model>>>16)&1);
  }
}
main().catch(err=>log("ERR",err.message));
</script></body></html>

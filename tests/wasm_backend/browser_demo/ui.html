<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lean/WASM UI laboratory</title>
  <style>
    :root {
      font-family: "Iosevka", "JetBrains Mono", ui-monospace, monospace;
      color: #e7e9ea;
      background: #0f1419;
      --panel: #1a2332;
      --border: #2f3b4a;
      --accent: #7aa2f7;
      --green: #9ece6a;
      --muted: #8b9bb4;
      --danger: #f7768e;
    }
    body { max-width: 44rem; margin: 1.5rem auto; padding: 0 1rem; line-height: 1.45; }
    h1 { font-size: 1.2rem; font-weight: 600; color: #fff; }
    p { color: var(--muted); font-family: system-ui, sans-serif; font-size: 0.95rem; }
    a { color: var(--accent); }
    #app { margin-top: 1rem; }
    .root {
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--panel); padding: 1rem 1.1rem;
    }
    .title { font-size: 1.05rem; color: #fff; margin-bottom: 0.35rem; }
    .msg { color: var(--muted); font-size: 0.9rem; margin-bottom: 0.75rem; min-height: 1.2em; }
    .panel { display: flex; flex-direction: column; gap: 0.65rem; }
    .goal {
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0.65rem 0.75rem; background: #121a24;
    }
    .goal.focus { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(122,162,247,0.25); }
    .goal-meta { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.35rem; }
    .hyps-hdr { color: var(--muted); font-size: 0.8rem; }
    .hyps { margin: 0.25rem 0 0.4rem 1rem; padding: 0; list-style: none; }
    .hyp {
      color: #c0caf5; margin: 0.15rem 0; padding: 0.15rem 0.35rem;
      border-radius: 4px; cursor: pointer; list-style: none;
    }
    .hyp:hover { background: #243044; color: #fff; }
    .hyp::before { content: "▸ "; color: var(--accent); }
    .turnstile { color: var(--accent); margin: 0.25rem 0; font-weight: 700; }
    .target { color: #9ece6a; font-weight: 600; }
    .banner.solved {
      color: var(--green); border: 1px solid #3d5a40; background: #152019;
      border-radius: 8px; padding: 0.85rem; text-align: center;
    }
    .tactics {
      display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.9rem;
      padding-top: 0.75rem; border-top: 1px solid var(--border);
    }
    .tac {
      font: inherit; cursor: pointer; border-radius: 6px;
      border: 1px solid var(--border); background: #243044; color: #e7e9ea;
      padding: 0.35rem 0.65rem;
    }
    .tac:hover:not(.disabled) { border-color: var(--accent); color: #fff; }
    .tac.disabled {
      opacity: 0.35; cursor: not-allowed; pointer-events: none;
    }
    .tac-intro { border-color: #3d5a80; }
    .tac-ctor { border-color: #5a4a3d; }
    .tac-reset { color: var(--danger); }
    .hint { margin-top: 0.75rem; color: var(--muted); font-size: 0.82rem; font-family: system-ui, sans-serif; }
    #status {
      margin-top: 1rem; padding: 0.7rem 0.85rem; border-radius: 6px;
      background: #1a2332; border: 1px solid var(--border);
      font-size: 0.85rem; color: var(--muted); white-space: pre-wrap;
    }
    #status.error { border-color: var(--danger); color: var(--danger); }
    .showcase-shell { display: grid; gap: 1rem; }
    .demo-tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 0.4rem; }
    .demo-tab { font: 0.78rem system-ui, sans-serif; color: var(--muted); background: #151e2a;
      border: 1px solid var(--border); border-radius: 7px; padding: 0.5rem; cursor: pointer; }
    .demo-tab:hover, .demo-tab.active { color: white; border-color: var(--accent); background: #20304a; }
    .demo-stage { min-height: 15rem; display: grid; align-items: center; }
    .counter-grid, .abi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 0.6rem; }
    .metric { background: #111923; border: 1px solid var(--border); border-radius: 8px; padding: 0.8rem; }
    .metric-label { display: block; color: var(--muted); font: 0.75rem system-ui; }
    .metric-value { display: block; color: var(--green); font-size: 1.15rem; margin-top: 0.25rem; }
    .term-tree, .tree-viz, .dungeon, .raft-viz { display: grid; gap: 0.75rem; justify-items: center; }
    .term-node, .tree-node, .room, .raft-node { border: 1px solid var(--accent); background: #17243a;
      border-radius: 8px; padding: 0.65rem 1rem; }
    .term-node.result, .tree-node.shared, .room.unlocked, .raft-node.leader { border-color: var(--green); }
    .term-arrow, .message-flight, .door { color: var(--muted); }
    .tree-level { display: flex; gap: 4rem; }
    .tree-node.fresh { border-color: #e0af68; }
    .constraint-grid { display: grid; grid-template-columns: repeat(3, 3.2rem); gap: 0.35rem; justify-content: center; }
    .constraint-cell { display: grid; place-items: center; aspect-ratio: 1; border: 1px solid var(--border);
      border-radius: 5px; background: #111923; color: var(--accent); }
    .demo-canvas { width: 100%; height: 220px; border: 1px solid var(--border); border-radius: 8px; }
    .payload-bar { display: flex; gap: 0.5rem; margin: 0.8rem 0; }
    .payload-bar input { flex: 1; color: white; background: #111923; border: 1px solid var(--border);
      border-radius: 6px; padding: 0.55rem 0.7rem; font: inherit; }
  </style>
</head>
<body>
  <h1>Lean/WASM UI laboratory</h1>
  <p>
    Ten interactive demos rendered by one Lean fiber reconciler through a typed linear-memory
    effect batch. DOM handlers use numeric IDs; the term editor below exercises UTF-8 payload events.
  </p>
  <div class="payload-bar"><input id="demo-input" value="λ x => x" aria-label="Term payload" /></div>
  <p>
    <a href="./">scalar demo</a> ·
    <a href="./core_rt.html">core RT</a>
  </p>
  <div id="app"><em>Loading…</em></div>
  <div id="status">Booting…</div>
  <script type="module" src="./ui_app.js"></script>
</body>
</html>

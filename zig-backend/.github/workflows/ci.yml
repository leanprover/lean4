# CI for the pure-Zig subset of the runtime.
#
# Only `zig build test` runs here: it needs no lean4 checkout, no stage1
# build, and no cmake — just a Zig toolchain and GMP. Everything else
# (test-abi, the smoke and differential suites, `zig build test-all`)
# requires a fully built lean4 stage1 tree and stays a local gate; see
# AGENTS.md.
name: ci

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install GMP
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      # Debian installs GMP under the multiarch prefix; Zig's native libc
      # detection already covers /usr/include/x86_64-linux-gnu and the
      # matching lib dir, so /usr as the prefix is sufficient.
      - name: Run unit tests
        run: zig build test -Dgmp-prefix=/usr
